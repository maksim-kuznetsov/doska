# Веб-сервер производственного развёртывания: HTML-оболочка SPA,
# проксирование API и внутренняя отдача медиафайлов.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API обслуживает приложение; путь сохраняется.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы медиа отдаёт веб-сервер по внутреннему перенаправлению приложения.
    location /media-internal/ {
        internal;
        alias /var/www/media/;
    }

    # Клиентская маршрутизация SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}