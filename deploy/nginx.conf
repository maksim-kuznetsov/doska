# Веб-сервер производственного развёртывания: HTML-оболочка SPA,
# проксирование API и внутренняя отдача медиафайлов.

# Перед nginx стоит Caddy, который завершает HTTPS. Заголовки пробрасываются
# дальше в API; при локальном запуске без Caddy используются значения по умолчанию.
map $http_x_forwarded_proto $doska_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_for $doska_forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

map $http_x_forwarded_host $doska_forwarded_host {
    default $http_x_forwarded_host;
    ""      $host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API обслуживает приложение; путь сохраняется.
    # Лимит покрывает 5 фотографий по 5 МБ плюс multipart-обвязку.
    # Без явной директивы nginx ограничивает тело 1 МБ и отвечает 413.
    location /api/ {
        client_max_body_size 32m;
        proxy_pass http://api:8080;
        proxy_set_header Host $doska_forwarded_host;
        proxy_set_header X-Real-IP $doska_forwarded_for;
        proxy_set_header X-Forwarded-For $doska_forwarded_for;
        proxy_set_header X-Forwarded-Proto $doska_forwarded_proto;
        proxy_set_header X-Forwarded-Host $doska_forwarded_host;
    }

    # Файлы медиа отдаёт веб-сервер по внутреннему перенаправлению приложения.
    location /media-internal/ {
        internal;
        alias /var/www/media/;
    }

    # HTML-оболочка SPA не кешируется: браузер ревалидирует страницу и получает
    # ссылки на актуальные версии статики.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Service worker и манифест обновляются вместе с релизом, поэтому
    # браузер должен получать их актуальные версии после деплоя.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Собранные Vite ассеты содержат хеш в имени, поэтому кешируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Клиентская маршрутизация SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}