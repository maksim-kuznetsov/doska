# Веб-сервер производственного развёртывания: HTML-оболочка SPA,
# проксирование API и внутренняя отдача медиафайлов.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API обслуживает приложение; путь сохраняется.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Файлы медиа отдаёт веб-сервер по внутреннему перенаправлению приложения.
    location /media-internal/ {
        internal;
        alias /var/www/media/;
    }

    # HTML-оболочка SPA не кешируется: браузер ревалидирует страницу и получает
    # ссылки на актуальные версии статики.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Service worker и манифест обновляются вместе с релизом, поэтому
    # браузер должен получать их актуальные версии после деплоя.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        types {
            application/manifest+json webmanifest;
        }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Собранные Vite ассеты содержат хеш в имени, поэтому кешируются надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Клиентская маршрутизация SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}