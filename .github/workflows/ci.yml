name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Секретов и записи не нужно: workflow только собирает и проверяет.
permissions:
  contents: read

# Проверяем только последний коммит ветки или PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: doska
          POSTGRES_USER: doska
          POSTGRES_PASSWORD: doska
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U doska -d doska"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ConnectionStrings__Default: "Host=localhost;Port=5433;Database=doska;Username=doska;Password=doska"
      TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore local tools
        working-directory: backend
        run: dotnet tool restore

      - name: Build
        run: dotnet build backend/Doska.sln --configuration Debug

      - name: Check that the model matches migrations
        working-directory: backend
        run: >-
          dotnet tool run dotnet-ef migrations has-pending-model-changes
          --project src/Doska.Infrastructure
          --startup-project src/Doska.Api
          --no-build

      - name: Apply migrations to a clean database
        working-directory: backend
        run: >-
          dotnet tool run dotnet-ef database update
          --project src/Doska.Infrastructure
          --startup-project src/Doska.Api
          --no-build

      - name: Test
        run: dotnet test backend/Doska.sln --no-build --configuration Debug

  frontend:
    name: Frontend (tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check PWA build
        run: pnpm check:pwa

  deployment-scripts:
    name: Deployment scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check nginx upload limit and syntax
        run: |
          limit=$(sed -nE 's/^[[:space:]]*client_max_body_size[[:space:]]+([0-9]+)([kKmMgG]?);.*/\1 \2/p' deploy/nginx.conf | head -n1)
          if [ -z "$limit" ]; then
            echo "::error file=deploy/nginx.conf::Не задан client_max_body_size. Ожидается client_max_body_size 32m."
            exit 1
          fi

          value=${limit% *}
          unit=${limit#* }
          case "$unit" in
            k|K) bytes=$((value * 1024)) ;;
            m|M) bytes=$((value * 1024 * 1024)) ;;
            g|G) bytes=$((value * 1024 * 1024 * 1024)) ;;
            *) bytes=$value ;;
          esac

          minimum=$((32 * 1024 * 1024))
          if [ "$bytes" -lt "$minimum" ]; then
            echo "::error file=deploy/nginx.conf::client_max_body_size ${value}${unit} меньше 32m."
            exit 1
          fi

          docker run --rm --add-host api:127.0.0.1 \
            -v "$GITHUB_WORKSPACE/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Check shell syntax
        run: |
          for file in deploy/*.sh; do
            bash -n "$file"
          done

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: ci-password
      DOMAIN: doska.example.com
      ACME_EMAIL: admin@example.com
      App__PublicBaseUrl: https://doska.example.com
      Email__Host: smtp.example.com
    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose
        run: docker compose -f docker-compose.prod.yml config

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
