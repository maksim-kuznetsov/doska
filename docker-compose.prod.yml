# Производственное развёртывание на одном сервере: PostgreSQL, API и веб-сервер.
# Значения секретов задаются в файле .env (см. .env.example); в репозиторий они не попадают.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Откат:   вернуть предыдущую ревизию кода и повторить команду; тома сохраняются.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doska}
      POSTGRES_USER: ${POSTGRES_USER:-doska}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doska} -d ${POSTGRES_DB:-doska}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-doska};Username=${POSTGRES_USER:-doska};Password=${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}"
      Media__RootPath: /var/www/media
    volumes:
      - media-data:/var/www/media
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - media-data:/var/www/media:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  data-protection-keys: