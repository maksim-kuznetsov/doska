# Производственное развёртывание на одном сервере: PostgreSQL, API, веб-сервер и HTTPS.
# Значения секретов задаются в файле .env (см. .env.example); в репозиторий они не попадают.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Откат:   вернуть предыдущую ревизию кода и повторить команду; тома сохраняются.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doska}
      POSTGRES_USER: ${POSTGRES_USER:-doska}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doska} -d ${POSTGRES_DB:-doska}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-doska};Username=${POSTGRES_USER:-doska};Password=${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}"
      Media__RootPath: /var/www/media
      App__PublicBaseUrl: ${App__PublicBaseUrl:?задайте App__PublicBaseUrl в .env}
      Google__ClientId: ${Google__ClientId:-}
      Google__ClientSecret: ${Google__ClientSecret:-}
      Email__Mode: ${Email__Mode:-File}
      Email__Host: ${Email__Host:-}
      Email__Port: ${Email__Port:-587}
      Email__UserName: ${Email__UserName:-}
      Email__Password: ${Email__Password:-}
      Email__From: ${Email__From:-no-reply@doska.local}
      Email__UseStartTls: ${Email__UseStartTls:-true}
      Email__OutboxPath: ${Email__OutboxPath:-/srv/doska/outbox}
    volumes:
      - media-data:/var/www/media
      - ./outbox:/srv/doska/outbox
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    volumes:
      - media-data:/var/www/media:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  data-protection-keys:
  caddy-data:
  caddy-config: